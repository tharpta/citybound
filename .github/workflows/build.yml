name: Legacy Release Build Probe

on:
  workflow_dispatch:
    inputs:
      product_owner_approved:
        description: "The product owner approved this manual compatibility probe"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build legacy release on Linux
    if: ${{ !github.event.repository.private && inputs.product_owner_approved }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Ensure tooling installed
      run: npm run ensure-tooling
    - name: Build browser client
      run: npm run build-browser
    - name: Build server and create bundle
      run: npm run build-server-bundle
