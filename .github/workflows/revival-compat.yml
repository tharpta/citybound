name: Revival Compatibility

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linker-wrapper-tests:
    name: Linker wrapper cleanup tests
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test scratch cleanup and exit propagation
        run: npm run test-linker-wrapper-compat && npm run test-runtime-teardown-compat

  planning-tests:
    name: Planning safety tests
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Cargo 1.43's bundled libgit2 fails against the current crates.io index.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Fetch dependencies, compile, and run planning safety tests
        run: repo_scripts/ci-test-planning-compat.sh
