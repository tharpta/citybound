name: Revival Compatibility

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - codex/**
  workflow_dispatch:

jobs:
  planning-tests:
    name: Planning safety tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run planning safety tests
        run: npm run test-planning-compat
