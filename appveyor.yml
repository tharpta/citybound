# Historical AppVeyor build and deployment are retired.
#
# The old configuration directly ran uncontained npm lifecycle scripts,
# downloaded toolchains, and deployed artifacts to an external S3 bucket.
# Revival CI is the bounded, zero-cost GitHub Actions workflow documented in
# docs/CI_POLICY.md. Keep this file inert so an existing AppVeyor project cannot
# fall back to implicit build behavior.
build: off
test: off
deploy: off
